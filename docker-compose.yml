services:
  qdrant:
    # Versão fixada para que todos os integrantes usem o mesmo servidor.
    image: qdrant/qdrant:v1.12.1
    container_name: paa_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
